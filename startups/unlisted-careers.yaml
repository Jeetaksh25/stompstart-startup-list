name: Unlisted Careers
tagline: Job search across company career sites
description: >-
  A job search that reads company career pages directly instead of a board that collects
  reposts. It tolerates spelling mistakes in a query, filters on seven fields, scores
  each opening against a resume, and tracks a saved job through to an offer. The site
  reports the number of direct openings it can see and how many arrived in the last
  hour.
problem: >-
  Job boards carry reposts and expired listings, so a search returns roles that the
  company is no longer hiring for.
audience:
  - Job seekers
  - Recruiters
  - Career changers
website: "https://unlisted.careers/"
