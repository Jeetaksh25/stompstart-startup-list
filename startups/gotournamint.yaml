name: GoTournamint
tagline: A word game where you pick the hidden words
description: >-
  A daily word game with the roles reversed: instead of guessing a word somebody else
  chose, the player chooses the words and shares the challenge. Each round is scored,
  and a tournament format lets a group play through several rounds rather than comparing
  a single daily score.
problem: >-
  A daily word game gives every player the same puzzle once, which leaves nothing to
  decide and nothing to compare between friends over time.
audience:
  - Puzzle players
  - Friend groups
  - Teachers
