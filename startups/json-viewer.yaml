# JSON Viewer: fast, private JSON reading for large files

name: JSON Viewer
tagline: A browser JSON viewer built to open big files
description: >-
  A JSON viewer that keeps working when a file is large. The tree loads in
  chunks, so a multi-megabyte API response opens without freezing the tab, and
  search covers every key and value. Parsing runs in the browser, so the
  document stays on the machine that opened it.
problem: Most online JSON tools are built for small snippets, and a large file either freezes the tab or gets uploaded to a server the reader does not control.
audience:
  - Developers reading large API responses
  - Engineers inspecting log exports
  - Analysts working with data files
