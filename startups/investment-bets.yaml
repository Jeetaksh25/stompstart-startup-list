name: Investment Bets
tagline: Paper trading scored by percentage return
description: >-
  A paper trading site where every position uses the same fixed exposure, so the
  leaderboard ranks percentage return instead of account size. Participants make long or
  short calls on stocks, the site prices them from real quotes, and the public record
  shows each participant's history. No real money changes hands.
problem: >-
  A public trading leaderboard that ranks by profit rewards a large account, so skill is
  hard to compare between participants.
audience:
  - Retail investors
  - Finance students
  - Trading communities
