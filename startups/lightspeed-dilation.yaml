name: LightSpeed
tagline: An interactive visualiser of time dilation
description: >-
  A browser toy that shows relativistic time dilation as you move. The user sets a speed
  and watches how much slower a clock travelling at that speed would run relative to a
  stationary one, with the effect drawn rather than described. It runs in the page with
  no install and no account.
problem: >-
  Time dilation is usually taught as a formula, which hides how lopsided the effect
  becomes as speed approaches the speed of light.
audience:
  - Physics students
  - Science teachers
  - Curious readers
