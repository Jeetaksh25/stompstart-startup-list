name: SnapTrade Pi
tagline: A desk display for a connected portfolio
description: >-
  A hardware project that puts a brokerage balance on a small e-paper screen. The
  display shows a pairing code, the owner approves access from a phone through
  SnapTrade, and the Pi then totals the supported balances and shows the number. The
  build instructions and the firmware are published as an open repository, and the site
  is explicit that the photograph is a prototype.
problem: >-
  Checking a portfolio means opening an app and scrolling, which is more attention than
  a single balance deserves.
audience:
  - Retail investors
  - Raspberry Pi builders
  - Desk setup enthusiasts
