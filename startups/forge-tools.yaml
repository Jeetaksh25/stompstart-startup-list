name: Forge Tools
tagline: Engineering calculators for the workshop
description: >-
  A set of calculators for workshop and garage work, built around practical units rather
  than textbook ones. Each tool states the method it uses, so the number can be checked
  by hand. The site adds tools over time and lists what arrived most recently.
problem: >-
  Workshop maths is usually spread across scattered web calculators that do not show how
  the answer was reached.
