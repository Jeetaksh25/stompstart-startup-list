name: Asusu Oma
tagline: Guided Igbo practice with recorded voices
description: >-
  A free app for learning Igbo, built around a learning path rather than a dictionary.
  Lessons come with recorded Igbo voices, and the site carries a resources section and a
  blog alongside the practice material. It is aimed at people who grew up hearing the
  language and want to speak it.
problem: >-
  Igbo learning material online is thin and rarely includes recorded speech, so learners
  practice from text alone.
audience:
  - Igbo learners
  - Heritage speakers
  - Language students
