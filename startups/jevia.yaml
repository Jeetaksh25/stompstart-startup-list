# Jevia: a model router that learns from verified outcomes

name: Jevia
tagline: Model routing that learns from verified outcomes
description: >-
  A command line tool that picks which model tier a coding task should run on
  and then records whether the result was actually good, so later decisions use
  those verified outcomes instead of a fixed rule. It installs from a prebuilt
  binary, so no Rust toolchain is needed, and it keeps its policy file and
  history local to the machine. The project is open source on GitHub.
problem: Teams route coding tasks between model tiers by hand, and the choice never learns from which attempts actually worked.
audience:
  - Developers running coding agents
  - Platform engineers managing model spend
  - Teams comparing model tiers
