name: RemoveBackgroundMusic
tagline: Strip the music from a video and keep the voices
description: >-
  A browser tool that takes a finished video and removes or reduces the background music
  while leaving speech and sound effects in place. A free preview runs before anything
  is committed, and the site answers the usual questions about which material works and
  what it costs.
problem: >-
  Separating music from dialogue in a finished edit usually means going back to the
  project files or paying for an audio suite.
audience:
  - Video editors
  - Podcasters
  - Content creators
