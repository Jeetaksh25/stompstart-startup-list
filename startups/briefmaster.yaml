name: BriefMaster 3000
tagline: Creative brief management for agencies
description: >-
  A tool for agencies that keeps creative briefs in one place instead of across email
  threads and documents. A brief carries the request, the client and the stage it has
  reached, so the team can see what has been asked for and what has been approved
  without reconstructing it from a mailbox.
problem: >-
  Agency briefs arrive as email and live in scattered documents, so nobody can say with
  confidence what a client actually approved.
audience:
  - Creative agencies
  - Marketing teams
  - Freelance designers
