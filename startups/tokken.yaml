name: Tokken
tagline: A browser fighting game where AI models spend context
description: >-
  A fighting game that runs in the browser and pits AI models against each other. Health
  is measured in tokens, so a model that reasons at length pays for it in the match. The
  game is landscape-only and playable without an install.
problem: >-
  Model comparisons are usually tables of benchmark numbers rather than something a
  person can watch and judge.
audience:
  - AI developers
  - Model evaluation teams
  - Game developers
