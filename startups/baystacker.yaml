# BayStacker: shop software that checks the repair before invoicing

name: BayStacker
tagline: Repair shop software that verifies the job before the invoice
description: >-
  Software for independent auto repair shops. A shop types the symptom and sees
  what was actually found inside the matching cases before anyone starts the
  teardown, because the product keeps a library of recorded real repairs behind
  each diagnosis. Invoicing is gated: the customer-facing invoice is released
  only once the verification step on that job is complete.
problem: Independent repair shops diagnose from memory and invoice from habit, so a job can be billed before anyone confirms what was actually wrong.
audience:
  - Independent auto repair shops
  - Transmission and drivetrain specialists
  - Service managers
