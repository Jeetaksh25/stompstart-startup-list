name: CaughtShipping
tagline: A curfew app for developers who ship late
description: >-
  A tool for people who keep working past the hour they meant to stop. The user sets a
  cutoff, and the app holds them to it. The site describes the mechanism plainly and the
  page is built to run without third-party tracking until consent is given.
problem: >-
  Late-night shipping is easy to start and hard to stop, and a normal alarm does not
  stand between a developer and a deploy.
audience:
  - Software developers
  - Remote workers
  - Students
